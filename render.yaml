services:
  # 1. PostgreSQL Database
  - type: psql
    name: unified-org-db
    plan: free

  # 2. Node.js Backend API
  - type: web
    name: unified-org-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unified-org-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true

  # 3. Vite React Frontend
  - type: web
    name: unified-org-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://unified-org-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
